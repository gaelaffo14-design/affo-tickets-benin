<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion — AFFO Studio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px 25px;
            border-radius: 22px;
            box-shadow: 0 15px 40px rgba(0,0,0,.10);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #2563eb;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .login-box input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        .login-box input:focus {
            border-color: #2563eb;
        }

        .login-box button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: #dc2626;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #6b7280;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main class="login-box">

        <div class="logo">
            AFFO Studio
        </div>

        <p class="subtitle">
            Connexion à votre espace administration
        </p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Adresse e-mail"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Mot de passe"
                required
            >

            <button type="submit">
                Se connecter
            </button>

        </form>

        <p id="message"></p>

        <a href="index.html" class="back">
            ← Retour au site
        </a>

    </main>

    <script type="module">

        import {
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

        import { auth } from "./js/firebase.js";

        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            message.textContent = "Connexion...";

            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                window.location.href = "admin.html";

            } catch (error) {

                console.error(error);

                message.textContent =
                    "E-mail ou mot de passe incorrect.";

            }

        });

    </script>

</body>
</html>
